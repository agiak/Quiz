<title>Το Εκατομμύριο</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Advent+Pro:wght@500;600;700&family=Commissioner:wght@400;500;600&display=swap">
<style>
/* Layout: TV studio at night — question stage on the left, money ladder on the right; ladder becomes a scroll strip on phones. Single dark look by choice. */
:root {
  color-scheme: dark;
  --ink: #090c22;
  --stage: #11173f;
  --stage-2: #18205a;
  --line: #3b4796;
  --brass: #e6b44c;
  --brass-ink: #1d1503;
  --text: #eef0ff;
  --muted: #98a1d4;
  --ok: #2fbf71;
  --bad: #e2485a;
  --display: "Advent Pro", "Arial Narrow", system-ui, sans-serif;
  --body: "Commissioner", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(ellipse 70% 45% at 50% -5%, rgba(110,130,255,.22), transparent 70%),
    radial-gradient(ellipse 40% 30% at 85% 105%, rgba(230,180,76,.10), transparent 70%),
    var(--ink);
  color: var(--text);
  font: 400 16px/1.5 var(--body);
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 28px; }
header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 20px; }
.logo { font: 700 clamp(28px, 4.4vw, 44px)/1 var(--display); letter-spacing: .02em; margin: 0; text-wrap: balance; }
.logo span { color: var(--brass); }
.sub { color: var(--muted); font-size: 14px; margin: 0; }

/* Stage */
.stage { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.lifelines { display: flex; flex-wrap: wrap; gap: 10px; }
.life {
  font: 600 14px/1 var(--body); color: var(--text); cursor: pointer;
  background: var(--stage); border: 1.5px solid var(--line); border-radius: 999px;
  padding: 10px 16px; display: inline-flex; align-items: center; gap: 8px;
  transition: border-color .15s, background .15s;
}
.life:hover:not(:disabled) { border-color: var(--brass); }
.life:focus-visible, .ans:focus-visible, .btn:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
.life:disabled { opacity: .38; cursor: not-allowed; text-decoration: line-through; }
.life b { font: 700 15px/1 var(--display); color: var(--brass); }

.qmeta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.qmeta strong { color: var(--brass); font: 700 20px/1 var(--display); letter-spacing: .02em; text-transform: none; font-variant-numeric: tabular-nums; }

.lozenge { --edge: var(--line); --fill: var(--stage); position: relative; background: var(--edge); clip-path: polygon(24px 0, calc(100% - 24px) 0, 100% 50%, calc(100% - 24px) 100%, 24px 100%, 0 50%); padding: 2px; }
.lozenge > .in { background: var(--fill); clip-path: inherit; }
.question .in { padding: 26px 48px; min-height: 120px; display: grid; place-items: center; text-align: center; }
.question p { margin: 0; font: 600 clamp(19px, 2.4vw, 24px)/1.35 var(--body); text-wrap: balance; }

.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
.ans { border: 0; margin: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; display: block; width: 100%; }
.ans .in { padding: 14px 34px; min-height: 58px; display: flex; align-items: center; gap: 12px; transition: background .15s; }
.ans .k { font: 700 19px/1 var(--display); color: var(--brass); min-width: 18px; }
.ans .t { font-weight: 500; }
.ans:hover:not([aria-disabled="true"]) { --edge: var(--brass); }
.ans.removed { visibility: hidden; }
.ans[aria-disabled="true"] { cursor: default; }
.ans.picked { --edge: var(--brass); --fill: var(--brass); }
.ans.picked .k, .ans.picked .t { color: var(--brass-ink); }
.ans.picked.pending { animation: blink .5s steps(2) infinite; }
.ans.right { --edge: var(--ok); --fill: var(--ok); }
.ans.right .k, .ans.right .t { color: #04170c; }
.ans.wrong { --edge: var(--bad); --fill: var(--bad); }
.ans.wrong .k, .ans.wrong .t { color: #fff; }
@keyframes blink { 50% { --fill: #b98a2c; filter: brightness(.82); } }

/* Host panel: confirm, help, results */
.panel { background: var(--stage); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.panel h2 { margin: 0; font: 700 22px/1.15 var(--display); letter-spacing: .02em; }
.panel p { margin: 0; color: var(--muted); }
.panel .say { color: var(--text); font-size: 17px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { font: 600 15px/1 var(--body); padding: 12px 20px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--stage-2); color: var(--text); cursor: pointer; }
.btn:hover { border-color: var(--brass); }
.btn.primary { background: var(--brass); border-color: var(--brass); color: var(--brass-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; }
.big { font: 700 clamp(40px, 7vw, 64px)/1 var(--display); color: var(--brass); font-variant-numeric: tabular-nums; }

.poll { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; align-items: end; height: 150px; max-width: 360px; }
.bar { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bar .v { font: 600 13px/1 var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
.bar .f { width: 100%; background: linear-gradient(var(--brass), #b4852a); border-radius: 4px 4px 0 0; min-height: 2px; transition: height .7s cubic-bezier(.2,.8,.2,1); }
.bar .l { font: 700 16px/1 var(--display); }

/* Ladder */
.ladder { list-style: none; margin: 0; padding: 12px; background: var(--stage); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column-reverse; gap: 2px; align-self: start; }
.ladder li { display: grid; grid-template-columns: 26px 1fr 16px; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 7px; font: 600 17px/1.2 var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
.ladder li .n { font-size: 14px; opacity: .8; }
.ladder li .m { text-align: right; }
.ladder li .c { color: var(--ok); font-size: 13px; text-align: center; }
.ladder li.safe { color: var(--text); }
.ladder li.safe .m::after { content: " ◆"; color: var(--brass); font-size: 11px; vertical-align: 2px; }
.ladder li.done { color: #6f78ad; }
.ladder li.now { background: var(--brass); color: var(--brass-ink); }
.ladder li.now.safe .m::after { color: var(--brass-ink); }
.legend { margin: 8px 4px 0; font-size: 12px; color: var(--muted); }
aside { min-width: 0; }

.hint { color: var(--muted); font-size: 13px; margin: 0; }
kbd { font: 600 12px/1 var(--body); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; color: var(--text); }

@media (max-width: 820px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  aside { order: -1; }
  .ladder-scroll { overflow-x: auto; scrollbar-width: thin; }
  .ladder { flex-direction: row; width: max-content; padding: 8px; gap: 4px; }
  .ladder li { grid-template-columns: auto; padding: 6px 10px; font-size: 15px; white-space: nowrap; }
  .ladder li .n, .ladder li .c { display: none; }
  .legend { display: none; }
}
@media (max-width: 560px) {
  .answers { grid-template-columns: 1fr; gap: 10px; }
  .question .in { padding: 20px 30px; min-height: 96px; }
  .lozenge { clip-path: polygon(16px 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 16px 100%, 0 50%); }
  .ans .in { padding: 12px 26px; min-height: 52px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .ans.picked.pending { animation: none; }
  .bar .f { transition: none; }
}
</style>

<div class="wrap">
  <header class="top">
    <h1 class="logo">Το <span>Εκατομμύριο</span></h1>
    <p class="sub">15 ερωτήσεις · 3 βοήθειες · 2 σταθμοί ασφαλείας</p>
  </header>

  <main class="stage">
    <div class="lifelines" role="group" aria-label="Βοήθειες">
      <button class="life" id="ll-fifty" type="button"><b>50:50</b> Μισά-μισά</button>
      <button class="life" id="ll-audience" type="button"><b>◔</b> Ρωτήστε το κοινό</button>
      <button class="life" id="ll-phone" type="button"><b>☎</b> Τηλεφώνημα σε φίλο</button>
    </div>

    <div class="qmeta">
      <span id="qnum">Ερώτηση 1 από 15</span>
      <span>Για <strong id="qprize">100 €</strong></span>
    </div>

    <div class="lozenge question"><div class="in"><p id="qtext"></p></div></div>

    <div class="answers" id="answers"></div>

    <section class="panel" id="panel" aria-live="polite"></section>

    <p class="hint">Πλήκτρα: <kbd>1</kbd>–<kbd>4</kbd> για απάντηση, <kbd>Enter</kbd> για επιβεβαίωση.</p>
  </main>

  <aside>
    <div class="ladder-scroll" id="ladderScroll">
      <ol class="ladder" id="ladder" aria-label="Κλίμακα κερδών"></ol>
    </div>
    <p class="legend">◆ Σταθμός ασφαλείας: αν χάσεις μετά από εδώ, κρατάς αυτό το ποσό.</p>
  </aside>
</div>

<script>
const LADDER = [100, 200, 300, 500, 1000, 2000, 4000, 8000, 16000, 32000, 64000, 125000, 250000, 500000, 1000000];
const SAFE = new Set([4, 9]);
const KEYS = ["Α", "Β", "Γ", "Δ"];

// [ερώτηση, [απαντήσεις], σωστή]  — μία ομάδα ανά βαθμίδα δυσκολίας
const BANK = [
  [["Πόσες μέρες έχει ένα δίσεκτο έτος;", ["365", "366", "364", "367"], 1],
   ["Τι χρώμα βγαίνει αν ανακατέψεις μπλε και κίτρινο;", ["Πράσινο", "Μωβ", "Πορτοκαλί", "Καφέ"], 0],
   ["Ποιο ζώο λένε «βασιλιά της ζούγκλας»;", ["Τον ελέφαντα", "Την τίγρη", "Το λιοντάρι", "Τον γορίλα"], 2]],
  [["Πόσες πλευρές έχει ένα εξάγωνο;", ["5", "6", "7", "8"], 1],
   ["Ποια είναι η πρωτεύουσα της Ιταλίας;", ["Μιλάνο", "Νάπολη", "Ρώμη", "Φλωρεντία"], 2],
   ["Σε πόσους βαθμούς Κελσίου βράζει το νερό στο επίπεδο της θάλασσας;", ["90", "100", "110", "120"], 1]],
  [["Ποιος έγραψε την «Οδύσσεια»;", ["Ο Όμηρος", "Ο Ησίοδος", "Ο Σοφοκλής", "Ο Αισχύλος"], 0],
   ["Ποιος πλανήτης λέγεται «ο Κόκκινος Πλανήτης»;", ["Η Αφροδίτη", "Ο Άρης", "Ο Δίας", "Ο Κρόνος"], 1],
   ["Πόσους παίκτες έχει μια ποδοσφαιρική ομάδα μέσα στο γήπεδο;", ["9", "10", "11", "12"], 2]],
  [["Ποιο είναι το ψηλότερο βουνό της Ελλάδας;", ["Ο Παρνασσός", "Ο Όλυμπος", "Ο Σμόλικας", "Ο Ταΰγετος"], 1],
   ["Ποιος είναι ο χημικός τύπος του νερού;", ["CO₂", "H₂O", "O₂", "NaCl"], 1],
   ["Σε ποια πόλη βρίσκεται ο Λευκός Πύργος;", ["Θεσσαλονίκη", "Καβάλα", "Βόλο", "Λάρισα"], 0]],
  [["Ποιος ήταν ο αρχηγός των θεών του Ολύμπου;", ["Ο Ποσειδώνας", "Ο Απόλλωνας", "Ο Δίας", "Ο Ήφαιστος"], 2],
   ["Ποιος ζωγράφισε τη «Μόνα Λίζα»;", ["Ο Μιχαήλ Άγγελος", "Ο Λεονάρντο ντα Βίντσι", "Ο Ραφαήλ", "Ο Ρέμπραντ"], 1],
   ["Ποιος είναι ο μεγαλύτερος ωκεανός της Γης;", ["Ο Ατλαντικός", "Ο Ινδικός", "Ο Ειρηνικός", "Ο Αρκτικός"], 2]],
  [["Ποια χρονιά έγιναν οι πρώτοι σύγχρονοι Ολυμπιακοί Αγώνες στην Αθήνα;", ["1876", "1896", "1904", "1912"], 1],
   ["Ποιο είναι το μεγαλύτερο ελληνικό νησί;", ["Η Εύβοια", "Η Κρήτη", "Η Λέσβος", "Η Ρόδος"], 1],
   ["Πόσα οστά έχει περίπου ο σκελετός ενός ενήλικα;", ["106", "206", "306", "406"], 1]],
  [["Ποιος έγραψε τη μουσική για την ταινία «Αλέξης Ζορμπάς»;", ["Ο Μάνος Χατζιδάκις", "Ο Μίκης Θεοδωράκης", "Ο Σταύρος Ξαρχάκος", "Ο Βαγγέλης Παπαθανασίου"], 1],
   ["Ποιο αέριο απορροφούν τα φυτά για τη φωτοσύνθεση;", ["Οξυγόνο", "Άζωτο", "Διοξείδιο του άνθρακα", "Υδρογόνο"], 2],
   ["Ποιος έγραψε τον «Ύμνο εις την Ελευθερίαν»;", ["Ο Κωστής Παλαμάς", "Ο Διονύσιος Σολωμός", "Ο Ανδρέας Κάλβος", "Ο Γεώργιος Σουρής"], 1]],
  [["Ποια είναι η πρωτεύουσα της Αυστραλίας;", ["Σίδνεϊ", "Μελβούρνη", "Καμπέρα", "Περθ"], 2],
   ["Ποιος διατύπωσε τη θεωρία της σχετικότητας;", ["Ο Νεύτωνας", "Ο Αϊνστάιν", "Ο Μπορ", "Ο Γαλιλαίος"], 1],
   ["Σε ποιο νησί γεννήθηκε ο Ελευθέριος Βενιζέλος;", ["Στην Κρήτη", "Στην Κέρκυρα", "Στη Σύρο", "Στη Χίο"], 0]],
  [["Ποια ναυμαχία του 480 π.Χ. έκρινε τους Περσικούς Πολέμους υπέρ των Ελλήνων;", ["Της Σαλαμίνας", "Του Ακτίου", "Της Ναυπάκτου", "Της Μυκάλης"], 0],
   ["Ποιο είναι το πιο διαδεδομένο χημικό στοιχείο στο Σύμπαν;", ["Το οξυγόνο", "Το ήλιο", "Το υδρογόνο", "Ο άνθρακας"], 2],
   ["Ποιος ήταν ο πρώτος Έλληνας που πήρε Νόμπελ Λογοτεχνίας;", ["Ο Οδυσσέας Ελύτης", "Ο Γιώργος Σεφέρης", "Ο Κωνσταντίνος Καβάφης", "Ο Γιάννης Ρίτσος"], 1]],
  [["Ποιος ήταν δάσκαλος του Μεγάλου Αλεξάνδρου;", ["Ο Πλάτωνας", "Ο Σωκράτης", "Ο Αριστοτέλης", "Ο Διογένης"], 2],
   ["Πόσα χρωμοσώματα έχει ένα ανθρώπινο σωματικό κύτταρο;", ["23", "44", "46", "48"], 2],
   ["Σε ποια σημερινή χώρα βρίσκεται η αρχαία πόλη Πέτρα;", ["Αίγυπτο", "Ιορδανία", "Συρία", "Λίβανο"], 1]],
  [["Ποιος είναι ο μακρύτερος ποταμός που κυλά ολόκληρος μέσα στην Ελλάδα;", ["Ο Αχελώος", "Ο Αλιάκμονας", "Ο Πηνειός", "Ο Έβρος"], 1],
   ["Ποιο μέταλλο έχει το υψηλότερο σημείο τήξης;", ["Ο σίδηρος", "Το τιτάνιο", "Το βολφράμιο", "Η πλατίνα"], 2],
   ["Ποιος αρχιτέκτονας σχεδίασε τη γυάλινη πυραμίδα του Λούβρου;", ["Ο Ι. Μ. Πέι", "Ο Φρανκ Γκέρι", "Ο Λε Κορμπυζιέ", "Η Ζάχα Χαντίντ"], 0]],
  [["Ποια χρονιά έγινε η Μικρασιατική Καταστροφή;", ["1912", "1919", "1922", "1928"], 2],
   ["Ποιος μέτρησε την περιφέρεια της Γης συγκρίνοντας σκιές σε Συήνη και Αλεξάνδρεια;", ["Ο Αρχιμήδης", "Ο Ερατοσθένης", "Ο Ευκλείδης", "Ο Ίππαρχος"], 1],
   ["Ποιο είναι το μικρότερο κράτος του κόσμου σε έκταση;", ["Το Μονακό", "Το Βατικανό", "Ο Άγιος Μαρίνος", "Το Λιχτενστάιν"], 1]],
  [["Ποιο από τα επτά θαύματα του αρχαίου κόσμου βρισκόταν στην Ολυμπία;", ["Ο Κολοσσός", "Το άγαλμα του Δία", "Το Μαυσωλείο", "Ο Φάρος"], 1],
   ["Ποιο στοιχείο έχει ατομικό αριθμό 79;", ["Ο άργυρος", "Ο χρυσός", "Ο υδράργυρος", "Ο μόλυβδος"], 1],
   ["Ποιος σκηνοθέτησε την ταινία «Μια αιωνιότητα και μια μέρα»;", ["Ο Θόδωρος Αγγελόπουλος", "Ο Μιχάλης Κακογιάννης", "Ο Κώστας Γαβράς", "Ο Γιώργος Λάνθιμος"], 0]],
  [["Σε ποια πόλη υπογράφηκε το 1923 η σύμβαση για την ανταλλαγή πληθυσμών Ελλάδας–Τουρκίας;", ["Στις Σεβρές", "Στη Λωζάνη", "Στις Βερσαλλίες", "Στο Βουκουρέστι"], 1],
   ["Πόσο χρειάζεται περίπου το φως του Ήλιου για να φτάσει στη Γη;", ["3 λεπτά", "8 λεπτά", "15 λεπτά", "30 λεπτά"], 1],
   ["Ποιος έγραψε το μυθιστόρημα «Ο Καπετάν Μιχάλης»;", ["Ο Νίκος Καζαντζάκης", "Ο Στράτης Μυριβήλης", "Ο Ηλίας Βενέζης", "Ο Αλέξανδρος Παπαδιαμάντης"], 0]],
  [["Ποιος σχεδίασε τον Παρθενώνα μαζί με τον Καλλικράτη;", ["Ο Ικτίνος", "Ο Μνησικλής", "Ο Φειδίας", "Ο Πολύκλειτος"], 0],
   ["Ποια χρονιά κατέλαβαν οι Σταυροφόροι την Κωνσταντινούπολη;", ["1054", "1204", "1261", "1453"], 1],
   ["Πού βρίσκεται το βαθύτερο σημείο της Μεσογείου;", ["Στο Φρέαρ των Οινουσσών", "Στην Τάφρο της Ρόδου", "Στη λεκάνη του Τυρρηνικού", "Στο βάθος της Μάλτας"], 0]],
];

const fmt = n => n.toLocaleString("el-GR") + " €";
const rand = n => Math.floor(Math.random() * n);
const $ = id => document.getElementById(id);

let S;

function newGame() {
  S = {
    level: 0,
    picks: BANK.map(group => rand(group.length)),
    used: { fifty: false, audience: false, phone: false },
    removed: [],
    phase: "ask",     // ask | confirm | reveal | over
    selected: null,
    help: null,       // { kind, data }
    won: null,
    outcome: null,    // win | lose | walk
  };
}

const current = () => BANK[S.level][S.picks[S.level]];
const safeAmount = lvl => lvl >= 10 ? LADDER[9] : lvl >= 5 ? LADDER[4] : 0;

function render() {
  const [q, opts, right] = current();
  $("qnum").textContent = `Ερώτηση ${S.level + 1} από 15`;
  $("qprize").textContent = fmt(LADDER[S.level]);
  $("qtext").textContent = q;

  const locked = S.phase === "reveal" || S.phase === "over";
  for (const k of ["fifty", "audience", "phone"]) $("ll-" + k).disabled = S.used[k] || locked;

  const box = $("answers");
  box.innerHTML = "";
  opts.forEach((t, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ans lozenge";
    b.innerHTML = `<div class="in"><span class="k">${KEYS[i]}</span><span class="t"></span></div>`;
    b.querySelector(".t").textContent = t;
    b.setAttribute("aria-label", `${KEYS[i]}: ${t}`);
    if (S.removed.includes(i)) b.classList.add("removed");
    if (S.selected === i) b.classList.add("picked");
    if (S.phase === "confirm" && S.selected === i) b.classList.add("pending");
    if (locked) {
      b.setAttribute("aria-disabled", "true");
      if (i === right) b.classList.add("right");
      else if (i === S.selected) b.classList.add("wrong");
    }
    b.addEventListener("click", () => choose(i));
    box.appendChild(b);
  });

  renderLadder();
  renderPanel();
}

function renderLadder() {
  const ol = $("ladder");
  ol.innerHTML = "";
  LADDER.forEach((m, i) => {
    const li = document.createElement("li");
    if (SAFE.has(i)) li.classList.add("safe");
    const passed = i < S.level || (S.outcome === "win" && i === S.level);
    if (passed) li.classList.add("done");
    if (i === S.level && S.outcome !== "win") li.classList.add("now");
    li.innerHTML = `<span class="n">${i + 1}</span><span class="m">${fmt(m)}</span><span class="c">${passed ? "✓" : ""}</span>`;
    ol.appendChild(li);
  });
  const now = ol.querySelector(".now");
  const sc = $("ladderScroll");
  if (now && sc.scrollWidth > sc.clientWidth) sc.scrollLeft = now.offsetLeft - sc.clientWidth / 2 + now.offsetWidth / 2;
}

function renderPanel() {
  const p = $("panel");
  const [, opts, right] = current();
  let html = "";

  if (S.phase === "over") {
    const titles = { win: "Κέρδισες το εκατομμύριο!", lose: "Λάθος απάντηση", walk: "Αποχώρησες" };
    const notes = {
      win: "Απάντησες σωστά και στις 15 ερωτήσεις.",
      lose: `Η σωστή απάντηση ήταν ${KEYS[right]}: ${opts[right]}. ${S.won ? "Κρατάς το ποσό του τελευταίου σταθμού ασφαλείας." : "Δεν είχες περάσει ακόμα τον πρώτο σταθμό ασφαλείας."}`,
      walk: `Η σωστή απάντηση ήταν ${KEYS[right]}: ${opts[right]}.`,
    };
    html = `<h2>${titles[S.outcome]}</h2><div class="big">${fmt(S.won)}</div><p>${esc(notes[S.outcome])}</p>
      <div class="row"><button class="btn primary" id="again" type="button">Νέο παιχνίδι</button></div>`;
  } else if (S.phase === "reveal") {
    const last = S.level === LADDER.length - 1;
    const safe = SAFE.has(S.level);
    html = `<h2>Σωστά!</h2><p class="say">Μόλις κέρδισες ${fmt(LADDER[S.level])}.${safe ? " Πέρασες σταθμό ασφαλείας: αυτό το ποσό είναι πια δικό σου." : ""}</p>
      <div class="row"><button class="btn primary" id="next" type="button">${last ? "Δες τα κέρδη" : "Επόμενη ερώτηση"}</button></div>`;
  } else if (S.phase === "confirm") {
    html = `<h2>Τελική απάντηση;</h2><p class="say">Διάλεξες ${KEYS[S.selected]}: ${esc(opts[S.selected])}.</p>
      <div class="row"><button class="btn primary" id="yes" type="button">Ναι, κλείδωσέ το</button><button class="btn ghost" id="no" type="button">Θα το ξανασκεφτώ</button></div>`;
  } else {
    const banked = S.level > 0 ? LADDER[S.level - 1] : 0;
    html = helpHtml() + `<div class="row"><p style="flex:1;min-width:200px">Διάλεξε απάντηση. Αν φύγεις τώρα, παίρνεις ${fmt(banked)}.</p>
      <button class="btn ghost" id="walk" type="button" ${S.level === 0 ? "disabled" : ""}>Αποχωρώ με ${fmt(banked)}</button></div>`;
  }

  if (S.phase === "confirm" && S.help) html = helpHtml() + html;
  p.innerHTML = html;

  const on = (id, fn) => { const el = $(id); if (el) el.addEventListener("click", fn); };
  on("again", () => { newGame(); render(); });
  on("next", nextQuestion);
  on("yes", lockIn);
  on("no", () => { S.selected = null; S.phase = "ask"; render(); });
  on("walk", walkAway);

  if (S.help && S.help.kind === "audience") {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      p.querySelectorAll(".bar .f").forEach(f => f.style.height = f.dataset.h + "%");
    }));
  }
}

function helpHtml() {
  if (!S.help) return "";
  if (S.help.kind === "audience") {
    const bars = S.help.data.map((v, i) =>
      `<div class="bar"><span class="v">${v}%</span><div class="f" style="height:0" data-h="${Math.max(v, 1)}"></div><span class="l">${KEYS[i]}</span></div>`).join("");
    return `<h2>Το κοινό ψήφισε</h2><div class="poll">${bars}</div>`;
  }
  if (S.help.kind === "phone") return `<h2>Στο τηλέφωνο ο φίλος σου</h2><p class="say">«${esc(S.help.data)}»</p>`;
  return "";
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function choose(i) {
  if (S.phase === "reveal" || S.phase === "over" || S.removed.includes(i)) return;
  S.selected = i;
  S.phase = "confirm";
  render();
  $("yes")?.focus();
}

function lockIn() {
  const [, , right] = current();
  if (S.selected === right) {
    S.phase = "reveal";
  } else {
    S.won = safeAmount(S.level);
    S.outcome = "lose";
    S.phase = "over";
  }
  S.help = null;
  render();
  ($("next") || $("again"))?.focus();
}

function nextQuestion() {
  if (S.level === LADDER.length - 1) {
    S.won = LADDER[S.level];
    S.outcome = "win";
    S.phase = "over";
  } else {
    S.level++;
    S.phase = "ask";
    S.selected = null;
    S.removed = [];
    S.help = null;
  }
  render();
}

function walkAway() {
  S.won = S.level > 0 ? LADDER[S.level - 1] : 0;
  S.outcome = "walk";
  S.phase = "over";
  S.selected = null;
  render();
}

function fifty() {
  if (S.used.fifty) return;
  const [, , right] = current();
  const wrong = [0, 1, 2, 3].filter(i => i !== right).sort(() => Math.random() - .5);
  S.removed = wrong.slice(0, 2);
  if (S.removed.includes(S.selected)) { S.selected = null; S.phase = "ask"; }
  S.used.fifty = true;
  render();
}

function audience() {
  if (S.used.audience) return;
  const [, , right] = current();
  const live = [0, 1, 2, 3].filter(i => !S.removed.includes(i));
  const accuracy = Math.max(0.3, 0.82 - S.level * 0.035);
  // λίγες φορές, στις δύσκολες, το κοινό μπερδεύεται
  const favourite = Math.random() < accuracy + 0.15 ? right : live.filter(i => i !== right)[rand(live.length - 1)];
  const w = [0, 0, 0, 0];
  live.forEach(i => w[i] = 5 + Math.random() * 25);
  w[favourite] += 40 + accuracy * 60;
  const total = w.reduce((a, b) => a + b, 0);
  const pct = w.map(v => Math.round(v / total * 100));
  pct[favourite] += 100 - pct.reduce((a, b) => a + b, 0);
  S.help = { kind: "audience", data: pct };
  S.used.audience = true;
  render();
}

function phone() {
  if (S.used.phone) return;
  const [, opts, right] = current();
  const live = [0, 1, 2, 3].filter(i => !S.removed.includes(i));
  const p = Math.max(0.45, 0.95 - S.level * 0.035);
  const knows = Math.random() < p;
  const guess = knows ? right : live.filter(i => i !== right)[rand(live.length - 1)];
  const a = `${KEYS[guess]}, ${opts[guess]}`;
  const lines = S.level < 5
    ? [`Αυτό το ξέρω σίγουρα. Είναι το ${a}.`, `Εύκολο! Πες ${a}.`]
    : S.level < 10
      ? [`Νομίζω ότι είναι το ${a}. Είμαι κάπου 70% σίγουρος.`, `Μου φαίνεται ${a}, αλλά μην το πάρεις όρκο.`]
      : [`Δύσκολο… Αν έπρεπε να διαλέξω, θα έλεγα ${a}. Δεν είμαι καθόλου σίγουρος.`, `Χμ, μάλλον ${a}; Μη στηριχτείς πολύ πάνω μου.`];
  S.help = { kind: "phone", data: lines[rand(lines.length)] };
  S.used.phone = true;
  render();
}

$("ll-fifty").addEventListener("click", fifty);
$("ll-audience").addEventListener("click", audience);
$("ll-phone").addEventListener("click", phone);

document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const map = { "1": 0, "2": 1, "3": 2, "4": 3, "a": 0, "b": 1, "c": 2, "d": 3, "α": 0, "β": 1, "γ": 2, "δ": 3 };
  const k = e.key.toLowerCase();
  if (k in map && (S.phase === "ask" || S.phase === "confirm")) { choose(map[k]); e.preventDefault(); }
  else if (e.key === "Escape" && S.phase === "confirm") { S.selected = null; S.phase = "ask"; render(); }
});

function start(saved) {
  if (saved && saved.S && Array.isArray(saved.S.picks) && saved.S.picks.length === BANK.length) S = saved.S;
  else newGame();
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
